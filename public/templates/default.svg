<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="842" height="595">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="842" height="595" fill="url(#bgGrad)" />

  <!-- Outer Frame -->
  <rect x="25" y="25" width="792" height="545" fill="none" stroke="url(#primaryGrad)" stroke-width="2" rx="12" />
  <rect x="35" y="35" width="772" height="525" fill="none" stroke="#334155" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="421" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="url(#primaryGrad)" letter-spacing="3">{{title}}</text>
  <text x="421" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">DEFAULT PROJECT SVG TEMPLATE</text>

  <!-- Dynamic Vector Table generated automatically for data list -->
  <g id="table-area" transform="translate(71, 140)">
    <!-- Header bar -->
    <rect x="0" y="0" width="700" height="34" rx="4" fill="#0284c7" />
    <text x="24" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">ID / CODE</text>
    <text x="180" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">DESCRIPTION / ITEM</text>
    <text x="480" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">QUANTITY</text>
    <text x="600" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">TOTAL</text>

    {{#items}}
    <g class="row" transform="translate(0, 0)">
      <rect x="0" y="34" width="700" height="30" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
      <text x="24" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">{{id}}</text>
      <text x="180" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#f1f5f9">{{item}}</text>
      <text x="480" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">{{quantity}}</text>
      <text x="600" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">${{total}}</text>
    </g>
    {{/items}}
  </g>

  <!-- Footer note -->
  <text x="421" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
    Pass '?url=...' to use a custom SVG template from Google Drive, GitHub, or direct link.
  </text>
</svg>
